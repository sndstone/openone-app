# Core unit tests on every push and pull request (no weights, no torch).
name: tests
on:
  push:
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema==4.26.0 pytest
      - run: python -m pytest tests/test_core.py -q
